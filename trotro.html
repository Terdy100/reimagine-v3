let audioCtx;
function playSuccessSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Out-of-this-world sci-fi Lydian chord sweep
    const freqs = [523.25, 659.25, 783.99, 987.77];
    freqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq / 2, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 0.1 + (i * 0.05));
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1 + (i * 0.05));
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5 + (i * 0.2));
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);
    });
  } catch(e) {}
}

document.getElementById('searchBtn').onclick=doSearch;
startSearchEl.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();if(e.key==='Escape')resultsEl.style.display='none';});
searchEl.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();if(e.key==='Escape')resultsEl.style.display='none';});

/* ---------- TROTRO JOURNEY PLANNER ----------
   The stops, the routes, the interchanges and the whole "which car, change
   where" decision all live in trotro-network.js. This section only:
     1. asks that file for itineraries,
     2. replaces its straight-line estimates with real OSRM driving times,
     3. prices each ride with trotro-pricing.js,
     4. draws the result.
   It makes no transport decisions of its own.
*/

const OSRM_CACHE=new Map();

async function osrm(a,b){
  const key=a.map(n=>n.toFixed(5)).join(',')+';'+b.map(n=>n.toFixed(5)).join(',');
  if(OSRM_CACHE.has(key))return OSRM_CACHE.get(key);
  const u='https://router.project-osrm.org/route/v1/driving/'+a[0]+','+a[1]+';'+b[0]+','+b[1]+'?overview=full&geometries=geojson';
  const r=await fetch(u);
  if(!r.ok)throw Error('OSRM');
  const d=await r.json();
  if(d.code!=='Ok'||!d.routes||!d.routes[0])throw Error('OSRM');
  OSRM_CACHE.set(key,d.routes[0]);
  return d.routes[0];
}

/* ---------- CAR COLOURS ON THE MAP --------------------------------------
   Each car is drawn in its own route colour, so a trip that uses two cars
   shows two colours and the change of car is visible. The route colours are
   not guaranteed to LOOK different from each other, though: measured against
   this network the Madina car (#1d4ed8) and the Osu car (#0e7490) are 83 RGB
   units apart, the Kasoa car (#e8710a) and the Tema car (#d93025) only 30, and
   the Nsawam and East Legon cars (#8b5cf6 and #7c3aed) just 3. A passenger
   cannot see a change of car in two lines that look the same.

   So when the next car's colour is too close to one already used on this
   trip, that car is drawn in a different colour taken from the other cars'
   own palette. Only the cars drawn for this trip are affected - the network's
   route data is never touched - and the first car always keeps its colour, so
   the line a passenger recognises is the one on the sign.
   ----------------------------------------------------------------------- */
const CAR_COLOR_MIN=120;  // RGB distance below which two cars look the same
const CAR_COLOR_POOL=(()=>{
  const pool=[];
  const add=c=>{if(c&&pool.indexOf(c)<0)pool.push(c)};
  if(window.TrotroNetwork&&TrotroNetwork.routes)TrotroNetwork.routes.forEach(r=>add(r.color));
  // A few strong colours no route uses yet, so a trip of four cars still has
  // something clearly different to fall back on.
  ['#4d7c0f','#334155','#a21caf','#065f46','#f59e0b'].forEach(add);
  return pool;
})();

function rgbOf(hex){
  const h=String(hex||'').replace('#','');
  return h.length===6?[0,2,4].map(i=>parseInt(h.substr(i,2),16)):[0,0,0];
}
function colorGap(a,b){
  const A=rgbOf(a),B=rgbOf(b);
  return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2);
}
// The colour each car is actually drawn in, kept apart from the colour of the
// car before it. Mutates the legs and the matching entry in itin.cars, which
// is what the chips, the legend and the map all read.
function assignCarColors(itin){
  const rides=itin.legs.filter(l=>l.kind==='ride');
  if(rides.length<2)return itin;
  const used=[];
  rides.forEach(leg=>{
    let color=leg.color;
    const nearest=used.length?Math.min(...used.map(u=>colorGap(u,color))):Infinity;
    if(nearest<CAR_COLOR_MIN){
      let pick=color,best=nearest;
      CAR_COLOR_POOL.forEach(c=>{
        const score=Math.min(...used.map(u=>colorGap(u,c)));
        if(score>best){best=score;pick=c}
      });
      if(best>nearest)color=pick;
    }
    leg.color=color;
    used.push(color);
  });
  const cars=(itin.cars||[]).filter(c=>c.name);
  rides.forEach((leg,i)=>{if(cars[i])cars[i].color=leg.color});
  return itin;
}

// Swap the network's straight-line estimates for real driving times and
// distances. A leg that OSRM cannot answer keeps its estimate and is marked,
// so the UI can say the time is an estimate instead of pretending otherwise.
async function hydrateItinerary(itin){
  // One entry per ride LEG, not per OSRM hop, so each car keeps its own colour
  // on the map. A two-car trip must not look like one long black line.
  const rideLegs=[];
  // The walks are kept in two piles, because they mean two different things
  // and are drawn in two different colours: grey reaching a stop to catch a
  // car, yellow moving to another stop to take another car.
  const walkSegments=[];   // walking to a stop
  const changeSegments=[]; // walking to a different stop to change cars
  let totalMeters=0,anyEstimated=false;

  for(const leg of itin.legs){
    if(leg.kind==='ride'){
      const segs=[];
      let meters=0,seconds=0,complete=true;
      for(let i=0;i<leg.coords.length-1;i++){
        try{
          const r=await osrm(leg.coords[i],leg.coords[i+1]);
          meters+=r.distance;seconds+=r.duration;
          if(r.geometry&&r.geometry.coordinates)segs.push(r.geometry.coordinates);
        }catch(e){
          // OSRM cannot answer this hop. Draw it straight rather than leave a
          // gap in the line, and keep the network's own estimate for the time.
          complete=false;
          segs.push([leg.coords[i],leg.coords[i+1]]);
        }
      }
      if(complete){
        leg.meters=meters;
        leg.seconds=seconds;
        leg.minutes=seconds/60;
        leg.estimated=false;
        totalMeters+=meters;
      }else{
        leg.estimated=true;
        anyEstimated=true;
      }
      rideLegs.push({color:leg.color||'#111827',segments:segs,leg:leg});
    }else{
      // Walk and transfer legs are short and genuinely straight, so they are
      // drawn directly. Without these a walk-only trip would draw no line.
      const into=leg.kind==='transfer'?changeSegments:walkSegments;
      for(let i=0;i<leg.coords.length-1;i++)into.push([leg.coords[i],leg.coords[i+1]]);
      // Walking is part of the trip the passenger makes, so it counts towards
      // how far the journey covers. A get-off leg has no distance at all.
      totalMeters+=leg.meters||0;
    }
  }

  itin.totalMeters=totalMeters;
  // The total includes the last bit on foot from the stop you get off at
  // (gapMinutes on the arrive leg). It is never drawn or listed as a walk
  // step, but the total has to carry it, otherwise the page would call the
  // journey that leaves you 1.7 km short of the destination the quicker one.
  itin.totalMinutes=itin.legs.reduce((s,l)=>s+(l.minutes||0)+(l.gapMinutes||0),0);
  itin.anyEstimated=anyEstimated;
  return {rideLegs:rideLegs,walkSegments:walkSegments,changeSegments:changeSegments,anyEstimated:anyEstimated};
}

// One fare per car ride, because you pay again when you change vehicles.
function priceItinerary(itin){
  const entries=[];
  for(const leg of itin.legs){
    if(leg.kind!=='ride')continue;
    entries.push({
      label:leg.fromName+' -> '+leg.toName,
      result:TrotroPricing.getFare(
        {name:leg.fromName,lon:leg.coords[0][0],lat:leg.coords[0][1]},
        {name:leg.toName,lon:leg.coords[leg.coords.length-1][0],lat:leg.coords[leg.coords.length-1][1]},
        {roadKm:leg.meters/1000}
      )
    });
  }
  return entries;
}

function itineraryFareTotal(entries){
  return entries.reduce((s,e)=>s+(e.result&&e.result.ok?e.result.fare:0),0);
}

// DOM markers added for the current journey. Map layers can be removed by id,
// but these have to be tracked so a new journey does not stack pins on old ones.
let itinPins=[];

// How far a searched point may sit from a known stop and still be treated as
// that stop. Roughly the length of a city block: close enough that the person
// meant the stop, far enough to absorb geocoder imprecision.
const meta_SNAP_M=600;

function clearItinerary(){
  ['itin-casing','itin-line','itin-walk-line','itin-change-casing','itin-change-line','itin-stops','itin-ends'].forEach(id=>{if(map.getLayer(id))map.removeLayer(id)});
  ['itin-route','itin-walk','itin-change','itin-stops','itin-ends'].forEach(id=>{if(map.getSource(id))map.removeSource(id)});
  itinPins.forEach(m=>m.remove());
  itinPins=[];
}

// Draw the chosen option: every car in its own colour, the walking parts, a
// pin wherever you board or get off, and a marked CHANGE point wherever the
// passenger has to leave one car and pick up another.
function drawItinerary(segs,origin,destination,itin){
  clearItinerary();
  const rideLegs=(segs&&segs.rideLegs)||[];
  const walks=(segs&&segs.walkSegments)||[];
  const changeWalks=(segs&&segs.changeSegments)||[];
  const all=[];
  rideLegs.forEach(r=>r.segments.forEach(s=>s.forEach(c=>all.push(c))));
  walks.forEach(seg=>seg.forEach(c=>all.push(c)));
  changeWalks.forEach(seg=>seg.forEach(c=>all.push(c)));

  // Grey, dashed: a walk that gets you to a stop to catch a car.
  if(walks.length){
    map.addSource('itin-walk',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'MultiLineString',coordinates:walks}}});
    map.addLayer({id:'itin-walk-line',type:'line',source:'itin-walk',paint:{'line-color':'#8a94a6','line-width':3,'line-opacity':.95,'line-dasharray':[1.4,1.6]}});
  }

  // Yellow, dashed, on a white casing: not a walk to a stop, but the move
  // between two stops to take a different car. Same colour as the CHANGE pin
  // and the change rows, so "stop here and take another car" reads the same on
  // the map as it does in the list.
  if(changeWalks.length){
    map.addSource('itin-change',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'MultiLineString',coordinates:changeWalks}}});
    map.addLayer({id:'itin-change-casing',type:'line',source:'itin-change',paint:{'line-color':'#fff','line-width':9,'line-opacity':.95}});
    map.addLayer({id:'itin-change-line',type:'line',source:'itin-change',paint:{'line-color':'#f6c800','line-width':5,'line-opacity':1,'line-dasharray':[1.5,1.4]}});
  }

  // Each car is a separate feature carrying its route colour, so the line on
  // the map visibly changes colour at the interchange. This is the single
  // clearest signal that the trip is not one continuous ride.
  const rideFeatures=[];
  rideLegs.forEach(r=>{
    r.segments.forEach(seg=>{
      rideFeatures.push({type:'Feature',properties:{color:r.color},geometry:{type:'LineString',coordinates:seg}});
    });
  });
  if(rideFeatures.length){
    map.addSource('itin-route',{type:'geojson',data:{type:'FeatureCollection',features:rideFeatures}});
    map.addLayer({id:'itin-casing',type:'line',source:'itin-route',paint:{'line-color':'#fff','line-width':11,'line-opacity':.95}});
    map.addLayer({
      id:'itin-line',type:'line',source:'itin-route',
      paint:{'line-color':['get','color'],'line-width':6,'line-opacity':.95}
    });
  }

  // Stops on the way, with the first and last stop of each car drawn larger.
  // Those two are exactly the points where you get on and get off, so the
  // boundaries between cars are visible even without the CHANGE pin.
  const pts=[];
  for(const leg of itin.legs){
    if(leg.kind!=='ride')continue;
    for(let i=0;i<leg.coords.length;i++){
      const first=i===0,last=i===leg.coords.length-1;
      const role=first?'board':last?'alight':'stop';
      pts.push({type:'Feature',properties:{role:role,color:leg.color||'#f6c800'},
        geometry:{type:'Point',coordinates:leg.coords[i]}});
    }
  }
  if(pts.length){
    map.addSource('itin-stops',{type:'geojson',data:{type:'FeatureCollection',features:pts}});
    map.addLayer({
      id:'itin-stops',type:'circle',source:'itin-stops',
      paint:{
        'circle-radius':['match',['get','role'],'board',8,'alight',8,4.5],
        'circle-color':['get','color'],
        'circle-stroke-color':'#fff','circle-stroke-width':2
      }
    });
  }

  // The change of car itself. Without this the passenger sees a line change
  // colour but has to guess why, so the interchange is pinned and numbered in
  // the order it happens.
  const changes=itin.legs.filter(l=>l.kind==='transfer');
  changes.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='change-pin';
    el.innerHTML='<span>'+(i+1)+'</span>';
    el.title='Change of car at '+c.atName;
    itinPins.push(new maplibregl.Marker({element:el}).setLngLat([c.lon,c.lat]).addTo(map));
  });

  // Where the journey starts and ends. Without these a straight line has no
  // visible beginning, and a walk-only trip looks like nothing at all.
  if(origin&&destination){
    const ends={type:'FeatureCollection',features:[
      {type:'Feature',properties:{kind:'origin'},geometry:{type:'Point',coordinates:origin}},
      {type:'Feature',properties:{kind:'dest'},geometry:{type:'Point',coordinates:destination}}
    ]};
    map.addSource('itin-ends',{type:'geojson',data:ends});
    map.addLayer({
      id:'itin-ends',type:'circle',source:'itin-ends',
      paint:{
        'circle-radius':['case',['==',['get','kind'],'dest'],7,6],
        'circle-color':['case',['==',['get','kind'],'dest'],'#e8710a','#1976ff'],
        'circle-stroke-color':'#fff','circle-stroke-width':2
      }
    });
  }

  if(all.length){
    const b=new maplibregl.LngLatBounds();
    b.extend(origin);b.extend(destination);all.forEach(c=>b.extend(c));
    map.fitBounds(b,{padding:{top:105,bottom:330,left:35,right:35},duration:900,maxZoom:16});
  }else{
    map.flyTo({center:destination,zoom:14,duration:900});
  }
}

function minutesLabel(m){return Math.max(1,Math.round(m))+' min'}

/* ---------- MULTI-CAR PRESENTATION --------------------------------------
   The planner already knows how many cars a trip needs and where the changes
   happen. These helpers put that in front of the passenger in one place, so
   the headline, the banner, the legend and the option cards can never
   disagree about whether the trip is one car or several.
   ---------------------------------------------------------------------- */

// "One car, no change" / "2 cars, 1 change" etc. Always states the car count
// first, because that is the thing a passenger needs to know before leaving.
function tripTitle(itin){
  if(!itin.hasRide)return 'Walk the whole way';
  const n=itin.rideCount||1;
  const cars=n+(n===1?' car':' cars');
  if(!itin.transfers)return cars+', no change';
  return cars+', '+itin.transfers+(itin.transfers===1?' change':' changes');
}

function changePoints(itin){
  return itin.legs.filter(l=>l.kind==='transfer');
}

// The stop the trip ends at, and how far the searched place is from it. The
// last leg of a car journey is a get-off stop, never a walk: how far you still
// have to go from there is the passenger's own business, and is stated rather
// than turned into walking time that the trip is charged for.
function finalStop(itin){
  const last=itin.legs[itin.legs.length-1];
  return last&&last.kind==='arrive'?last:null;
}

function endGap(itin){
  const stop=finalStop(itin);
  return stop?stop.gapM||0:0;
}

// One sentence for the end of the trip, used by the card step and the legend,
// so both say exactly the same thing.
function arrivalDetail(leg){
  const gap=leg.gapM||0;
  if(gap<60)return 'Your journey ends here. This is the stop you asked for.';
  const walkTime=leg.gapMinutes?', about '+Math.max(1,Math.round(leg.gapMinutes))+' min on foot':'';
  return 'Your journey ends here. What you searched for is about '
    +prettyDistance(gap/1000)+' from this stop, on foot from here'+walkTime+'.';
}

// A row of coloured chips, one per car, in order. The dot is the exact colour
// used for that car on the map, so the two can be matched at a glance.
function renderCarChips(itin){
  routeCarsEl.innerHTML='';
  const cars=(itin.cars||[]).filter(c=>c.name);
  if(!cars.length){routeCarsEl.style.display='none';return;}
  cars.forEach((c,i)=>{
    const chip=document.createElement('span');
    chip.className='car-chip';
    const dot=document.createElement('span');
    dot.className='car-dot';
    dot.style.background=c.color||'#111827';
    const label=document.createElement('span');
    // Numbered so the order on the map is unambiguous.
    label.textContent=(i+1)+'. '+c.name;
    chip.append(dot,label);
    routeCarsEl.appendChild(chip);
  });
  routeCarsEl.style.display='flex';
}

// The dark banner naming the interchange. This is the one element that makes
// "you will have to get out and take a different car" impossible to miss.
function renderChangeBanner(itin){
  const changes=changePoints(itin);
  if(!changes.length){routeChangeEl.style.display='none';return;}

  routeChangeEl.innerHTML='';
  const icon=document.createElement('div');
  icon.className='cb-icon';
  icon.textContent=changes.length;

  const body=document.createElement('div');
  const first=document.createElement('div');
  const n=itin.rideCount||changes.length+1;
  first.append(document.createTextNode('This trip is not one car. You take '));
  const strong=document.createElement('b');
  strong.textContent=n+(n===1?' car':' cars');
  first.append(strong,document.createTextNode(' and change '+(changes.length===1?'car':'cars')+':'));

  const list=document.createElement('div');
  changes.forEach((c,i)=>{
    const line=document.createElement('div');
    line.style.marginTop='3px';
    const num=document.createElement('span');
    num.textContent=(i+1)+'. ';
    const where=document.createElement('span');
    where.className='cb-where';
    where.textContent=c.atName;
    line.append(num,where);
    if(c.station)line.append(document.createTextNode(' (bus station)'));
    list.appendChild(line);
  });

  const pay=document.createElement('div');
  pay.style.marginTop='5px';
  pay.style.opacity='.85';
  pay.textContent='You get out, wait, and pay the next driver separately.';

  body.append(first,list,pay);
  routeChangeEl.append(icon,body);
  routeChangeEl.style.display='flex';
}

// One line of the map key: a swatch in the colour of a line on the map, and
// what that line means.
function legendKeyRow(swatchClass,text){
  const row=document.createElement('div');
  row.className='legend-row';
  const bar=document.createElement('span');
  bar.className='legend-bar '+swatchClass;
  const main=document.createElement('div');
  main.className='legend-main';
  const det=document.createElement('div');
  det.className='legend-detail';
  det.textContent=text;
  main.appendChild(det);
  row.append(bar,main);
  return row;
}

// Step-by-step list matching what is drawn on the map: walk, each car with its
// colour, and each change numbered the same way as the map pins.
function renderCarLegend(itin){
  legendEl.innerHTML='';
  legendEl.style.display='none';
}

/* ---------- FARES ------------------------------------------------------
   Every price, band, ladder and rule lives in trotro-pricing.js.
   This section only asks that file for a number and draws it. It never
   invents a fare and never hard-codes one.
   ---------------------------------------------------------------------- */

const CONFIDENCE_RANK={high:3,medium:2,low:1};

function renderFareBox(entries){
  fareEl.innerHTML='';
  if(!window.TrotroPricing){
    fareEl.style.display='block';
    fareEl.innerHTML='<div class="fare-note">trotro-pricing.js did not load, so no fare can be shown.</div>';
    return;
  }
  const priced=entries.filter(e=>e&&e.result&&e.result.ok&&e.result.fare!=null);
  if(!priced.length){fareEl.style.display='none';return;}

  const total=priced.reduce((s,e)=>s+e.result.fare,0);
  const confidence=priced.reduce((w,e)=>{
    const c=e.result.confidence;
    return (CONFIDENCE_RANK[c]||0)>(CONFIDENCE_RANK[w]||0)?c:w;
  },'low');

  const top=document.createElement('div');
  top.className='fare-top';
  const label=document.createElement('span');label.className='fare-label';label.textContent=priced.length>1?'Fares on this journey':'Approved fare';
  const amount=document.createElement('span');amount.className='fare-amount';amount.textContent=TrotroPricing.formatCedis(total);
  const pill=document.createElement('span');pill.className='fare-conf '+confidence;
  pill.textContent=confidence==='high'?'Published fare':confidence==='medium'?'Corridor fare':'Estimate';
  top.append(label,amount,pill);
  fareEl.appendChild(top);

  if(priced.length>1){
    const list=document.createElement('div');list.className='fare-legs';
    // Say up front that the trip is more than one car, so the extra lines are
    // not a mystery or a double charge.
    const why=document.createElement('div');
    why.className='fare-leg';
    const w=document.createElement('span');
    w.textContent='This trip uses '+priced.length+' cars, so you pay '+priced.length+' times:';
    list.appendChild(why);
    priced.forEach((e,i)=>{
      const row=document.createElement('div');row.className='fare-leg';
      const a=document.createElement('span');a.textContent=e.label;
      const b=document.createElement('b');b.textContent=TrotroPricing.formatCedis(e.result.fare);
      row.append(a,b);list.appendChild(row);
    });
    const row=document.createElement('div');row.className='fare-leg';
    const a=document.createElement('span');a.textContent='Total';
    const b=document.createElement('b');b.textContent=TrotroPricing.formatCedis(total);
    row.append(a,b);list.appendChild(row);
    fareEl.appendChild(list);
  }

  const notes=[];
  priced.forEach(e=>(e.result.notes||[]).forEach(n=>{if(notes.indexOf(n)<0)notes.push(n)}));
  if(notes.length){
    const n=document.createElement('div');n.className='fare-note';n.textContent=notes.join(' ');
    fareEl.appendChild(n);
  }

  const src=document.createElement('div');src.className='fare-src';
  src.textContent='GPRTU / GRTCC approved fares effective '+TrotroPricing.meta.effectiveDate+' (schedule '+TrotroPricing.version+').';
  fareEl.appendChild(src);
  fareEl.style.display='block';
}

// Fare for a trip with no verified route: priced from your position to the
// searched place. Uses the real driving distance when OSRM answers, and the
// straight-line fallback in the pricing file when it does not.
async function showStraightLineFare(item,dest,requestId){
  if(!window.TrotroPricing)return;
  const startP = originPlace ? [originPlace.lon, originPlace.lat] : userPos;
  if(!startP) return;
  fareEl.style.display='none';
  const fromName=TrotroPricing.nearestKnownPlaceName({lat:startP[1],lon:startP[0]});
  let roadKm=null;
  try{
    const r=await osrm(startP,dest);
    if(requestId!==activeRouteRequest)return;
    roadKm=r.distance/1000;
  }catch(e){/* fall back to the pricing file's own distance model */}
  const result=TrotroPricing.getFare(
    {name:fromName||'Your start point',lat:startP[1],lon:startP[0]},
    {name:item.name,lat:item.lat,lon:item.lon},
    {roadKm:roadKm}
  );
  renderFareBox([{label:(originPlace?originPlace.name:'Your position')+' -> '+item.name,result:result}]);
}

// Render one option as a card: each step in order, with the fare for each car.
function renderOption(itin,fareEntries,index,isBest){
  const card=document.createElement('div');
  card.className='option'+(isBest?' best':'');

  const head=document.createElement('div');
  head.className='option-head';
  const title=document.createElement('div');
  title.className='option-title';
  // Same wording as the big headline, so a multi-car option never reads as a
  // single long ride.
  title.textContent=tripTitle(itin);
  const fare=document.createElement('div');
  fare.className='option-fare';
  const total=itineraryFareTotal(fareEntries);
  fare.textContent=itin.hasRide?(total?TrotroPricing.formatCedis(total):'no fare'):'Free';
  head.append(title,fare);
  card.appendChild(head);

  const meta=document.createElement('div');
  meta.className='option-meta';
  meta.textContent=minutesLabel(itin.totalMinutes)+' total'
    +(itin.hasRide?' | '+itin.rideCount+' car'+(itin.rideCount===1?'':'s')+(itin.transfers?', changing at '+changePoints(itin).map(c=>c.atName).join(', '):''):'')
    +(itin.anyEstimated?' | times partly estimated':'');
  card.appendChild(meta);

  // Coloured chips matching the map lines, so it is obvious this option is
  // made of more than one car.
  const carList=(itin.cars||[]).filter(c=>c.name);
  if(carList.length>1){
    const chips=document.createElement('div');
    chips.className='trip-cars';
    carList.forEach((c,i)=>{
      const chip=document.createElement('span');
      chip.className='car-chip';
      const dot=document.createElement('span');
      dot.className='car-dot';
      dot.style.background=c.color||'#111827';
      const label=document.createElement('span');
      label.textContent=(i+1)+'. '+c.name;
      chip.append(dot,label);
      chips.appendChild(chip);
    });
    card.appendChild(chips);
  }

  const steps=document.createElement('div');
  steps.className='option-steps';
  const changes=changePoints(itin);
  let carNo=0,lastCarColor='#111827';
  itin.legs.forEach((leg,li)=>{
    const row=document.createElement('div');
    row.className='step';
    if(leg.kind==='ride'){
      carNo++;
      lastCarColor=leg.color||lastCarColor;
      const fareEntry=fareEntries.find(e=>e.label===leg.fromName+' -> '+leg.toName);
      const amt=fareEntry&&fareEntry.result&&fareEntry.result.ok?TrotroPricing.formatCedis(fareEntry.result.fare):'';
      // The tag carries the car's map colour and its number, so a step can be
      // tied back to the line and the chip above.
      const tag=document.createElement('span');
      tag.className='step-tag car';
      tag.textContent='CAR '+carNo;
      tag.style.background=leg.color||'#111827';
      row.appendChild(tag);
      const main=document.createElement('div');
      main.className='step-main';
      const n=document.createElement('div');n.className='step-name';
      n.textContent='Board the '+(leg.travelName||leg.routeName)+' at '+leg.fromName;
      const d=document.createElement('div');d.className='step-detail';
      d.textContent='Get off at '+leg.toName+' | '+prettyDistance(leg.meters/1000);
      main.append(n,d);
      const t=document.createElement('div');t.className='step-time';
      t.textContent=minutesLabel(leg.minutes)+(amt?' | '+amt:'');
      row.append(main,t);
    }else if(leg.kind==='transfer'){
      // Numbered to match the CHANGE pin on the map, and given the change
      // colour, so a list of steps shows at a glance where a car is left and
      // another one taken.
      row.className+=' step-row-change';
      const tag=document.createElement('span');
      tag.className='step-tag change';
      tag.textContent='CHANGE CAR';
      row.appendChild(tag);
      const main=document.createElement('div');
      main.className='step-main';
      const n=document.createElement('div');n.className='step-name';
      n.textContent='Change '+(changes.indexOf(leg)+1)+' of '+changes.length+' at '+leg.atName;
      const d=document.createElement('div');d.className='step-detail';
      d.textContent=(leg.station?'Bus station. ':'')
        +(leg.walked&&leg.meters?'Walk '+prettyDistance(leg.meters/1000)+' to the next stop. ':'')
        +'Leave car '+carNo+' and board a different one'
        +(carNo+1<=(itin.rideCount||0)?' (car '+(carNo+1)+')':'');
      main.append(n,d);
      const t=document.createElement('div');t.className='step-time';
      t.textContent='~'+Math.round(leg.minutes||0)+' min wait';
      row.append(main,t);
    }else if(leg.kind==='arrive'){
      // The end of the trip: a stop you get off at. This is deliberately not a
      // walk. Walking to the destination was removed, and the honest thing to
      // say instead is which stop the car stops at and how far the searched
      // place still is from there.
      row.className+=' step-row-end';
      row.style.boxShadow='inset 3px 0 0 '+(lastCarColor||'#111827');
      const tag=document.createElement('span');
      tag.className='step-tag stop';
      tag.textContent='GET OFF';
      // The colour of the car being got off, which is the colour it is drawn
      // in on the map.
      tag.style.background=lastCarColor||'#111827';
      row.appendChild(tag);
      const main=document.createElement('div');
      main.className='step-main';
      const n=document.createElement('div');n.className='step-name';
      n.textContent='Get off at '+leg.atName+(leg.station?' (bus station)':'');
      const d=document.createElement('div');d.className='step-detail';
      d.textContent=arrivalDetail(leg);
      main.append(n,d);
      const t=document.createElement('div');t.className='step-time';
      t.textContent='end of trip';
      row.append(main,t);
    }else{
      row.innerHTML='<span class="step-tag walk">WALK</span>';
      const main=document.createElement('div');
      main.className='step-main';
      const n=document.createElement('div');n.className='step-name';n.textContent=leg.detail;
      // meters are metres; prettyDistance wants km. Passing metres straight
      // through printed a 400 m walk as "400.0 km".
      const d=document.createElement('div');d.className='step-detail';d.textContent=prettyDistance((leg.meters||0)/1000);
      main.append(n,d);
      const t=document.createElement('div');t.className='step-time';t.textContent='~'+Math.round(leg.minutes||0)+' min';
      row.append(main,t);
    }
    steps.appendChild(row);
  });
  card.appendChild(steps);
  return card;
}

/* ---------- WHERE THE TRIP STARTS -----------------------------------------
   This is the part a passenger gets wrong most often, and the app was wrong
   about it silently. A browser's location can be a network-based guess, a
   stale fix, or nothing at all; when no stop was near the position the planner
   quietly fell back to the Circle hub, so searching "Circle" answered "walk 0
   m, free" while the person was in Labadi.

   Three things follow from that, and all three are here:
     1. the start of the trip is always named on screen,
     2. it can be changed to any trotro stop with one tap, which is how a wrong
        position is corrected, and
     3. a start that is the same place as the destination is answered as "you
        are already here" instead of a zero-minute walk.
   ----------------------------------------------------------------------- */
function replan(){
  if(lastPlace)selectPlace(lastPlace);
}

// The nearest stops to the detected position, so a wrong fix can be replaced by
// the stop the passenger is actually standing at.
/* ---------- WHERE THE TRIP STARTS, AND HOW THAT IS DECIDED -----------------
   The reported bug was not a wording problem. A browser's position can be a
   network-based guess, a stale fix, or a fix from a laptop in another country.
   The old code planned from that position when it happened to be near a stop,
   fell back to the Circle hub when it was not, and said nothing either way. A
   person standing in Labadi was therefore told they were already at Circle,
   because the trip had been planned FROM Circle.

   Three rules stop that class of error rather than papering over it:
     1. one function decides the start, and it returns how sure it is, so every
        screen and the map are driven by the same recorded answer;
     2. a start the app is not sure about is marked uncertain and offers the
        stop picker, instead of being presented as fact;
     3. a new position that moves away from the start the current trip was built
        from rebuilds that trip, so the plan and the blue dot can never disagree.
   ----------------------------------------------------------------------- */


function toggleStopPicker(){
  const open=document.getElementById('stopPicker');
  if(open){open.remove();return;}
  if(!window.TrotroNetwork)return;
  const box=document.createElement('div');
  box.id='stopPicker';
  box.className='stop-picker';
  const title=document.createElement('div');
  title.className='sp-title';
  title.textContent='Which trotro stop are you setting off from?';
  box.appendChild(title);

  const near=userPos?window.TrotroNetwork.stopsNear(userPos,6000).slice(0,6):[];
  near.forEach(s=>{
    const row=document.createElement('div');
    row.className='sp-row';
    const a=document.createElement('span');a.textContent=s.stop.displayName;
    const b=document.createElement('span');b.textContent=prettyDistance(s.meters/1000);
    row.append(a,b);
    row.addEventListener('click',()=>{chosenStart=s.stop;box.remove();replan();});
    box.appendChild(row);
  });
  if(near.length){
    const gap=document.createElement('div');
    gap.className='fare-note';
    gap.textContent='Stops more than 6 km from the detected position are not listed.';
    box.appendChild(gap);
  }
  const mine=document.createElement('div');
  mine.className='sp-row';
  const ma=document.createElement('span');ma.textContent='Use my position';
  const mb=document.createElement('span');mb.textContent=chosenStart?'as detected':'detected';
  mine.append(ma,mb);
  mine.addEventListener('click',()=>{chosenStart=null;box.remove();replan();});
  box.appendChild(mine);

  startEl.parentNode.insertBefore(box,startEl.nextSibling);
}

function resolveStart(){
  if(chosenStart){
    return {point:[chosenStart.lon,chosenStart.lat],stop:chosenStart,how:'you chose this stop',sure:true};
  }
  if(originPlace){
    var byName=window.TrotroNetwork?window.TrotroNetwork.matchStop(originPlace.name):null;
    var stop=null;
    if(byName&&byName.score>=40){
      stop=byName.stop;
    }else{
      var near=window.TrotroNetwork?window.TrotroNetwork.nearestStop([originPlace.lon,originPlace.lat]):null;
      if(near&&near.meters<=2000)stop=near.stop;
    }
    return {point:stop ? [stop.lon, stop.lat] : [originPlace.lon,originPlace.lat],stop:stop,how:'from search',sure:true};
  }
  if(!userPos||!window.TrotroNetwork){
    return {point:null,stop:null,how:'',sure:false};
  }
  var near=window.TrotroNetwork.nearestStop(userPos);
  var walkReach=window.TrotroNetwork.meta.accessWalkM;
  if(userAccuracy&&userAccuracy>800){
    return {point:userPos,stop:near?near.stop:null,
      how:'your position is only accurate to about '+prettyDistance(userAccuracy/1000),sure:false};
  }
  if(near&&near.meters>START_UNSURE_M){
    return {point:userPos,stop:near.stop,
      how:'your position is '+prettyDistance(near.meters/1000)+' from the nearest trotro stop, so it may be the wrong place',sure:false};
  }
  if(near&&near.meters<=walkReach){
    return {point:userPos,stop:near.stop,
      how:'nearest stop '+near.stop.displayName+' ('+prettyDistance(near.meters/1000)+')',sure:true};
  }
  return {point:userPos,stop:near?near.stop:null,
    how:'no trotro stop is within walking distance of your position',sure:false};
}
// Name the start of the trip, and offer the fix when the app is not sure.

function renderStartRow(){
  const open=document.getElementById('stopPicker');
  if(open)open.remove();
  if(!activeStart||!activeStart.point){startEl.style.display='none';return;}

  startEl.innerHTML='';
  const label=document.createElement('span');
  label.className='sr-label';
  label.textContent='Start';
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='start-btn'+(activeStart.sure?'':' unsure');
  btn.textContent=activeStart.stop?activeStart.stop.displayName:'my position';

  const note=document.createElement('span');
  note.textContent=activeStart.how||'';
  if(!activeStart.sure)note.textContent+=(note.textContent?' * ':'')+'tap to set the stop you are at';

  btn.addEventListener('click',toggleStopPicker);
  startEl.append(label,btn,note);
  startEl.style.display='flex';
}

async function selectPlace(item){
  resultsEl.style.display='none';
  activeInput.value=item.name;
  var dest=[item.lon,item.lat];
  new maplibregl.Popup({offset:20}).setLngLat(dest).setHTML('<strong>'+escapeHtml(item.name)+'</strong><br><small>'+escapeHtml(item.address||'Ghana')+'</small>').addTo(map);

  if(activeInput === startSearchEl) {
    originPlace = item;
    chosenStart = null;
    if (!lastPlace) {
      headline.textContent='Start selected';
      subline.textContent='Now enter your destination.';
      map.flyTo({center:[originPlace.lon,originPlace.lat],zoom:15,duration:900});
      return;
    }
  } else {
    lastPlace = item;
    if(!originPlace && userPos){
      startSearchEl.value = detectedPlaceName;
    }
    if (!originPlace && !userPos) {
      headline.textContent='Where are you starting from?';
      subline.textContent='Allow location access or type a start location.';
      return;
    }
  }

  dest = [lastPlace.lon, lastPlace.lat];
  item = lastPlace;

  clearItinerary();
  routeInfo.style.display='block';
  routeTitle.textContent='Working out how to get there...';
  etaMain.textContent='--';
  routeMeta.textContent='Finding which car passes near you, where to change, and the road times...';
  // Clear the multi-car cues as well, so a previous trip's interchange is not
  // left on screen while the next one is being worked out.
  routeCarsEl.innerHTML='';routeCarsEl.style.display='none';
  routeChangeEl.innerHTML='';routeChangeEl.style.display='none';
  legendEl.innerHTML='';legendEl.style.display='none';
  etaArrival.textContent='';
  journeyEl.innerHTML='';
  fareEl.style.display='none';
  startEl.style.display='none';

  const requestId=++activeRouteRequest;

  if(!window.TrotroNetwork){
    routeTitle.textContent='Route data unavailable';
    etaMain.textContent='--';
    routeMeta.textContent='trotro-network.js did not load, so no journey can be planned.';
    journeyEl.innerHTML='<div class="notice">The stop and route network could not be loaded. Check that trotro-network.js sits next to this page.</div>';
    return;
  }

  // Which stops can you reach on foot, and which car can you catch?
  /* A place name from the search box is a POINT, and the point a public
     geocoder returns for Greater Accra is often nowhere near where a trotro
     actually stops: measured against this network "Ablekuma" comes back 6 km
     out, "Adenta" 2.4 km and "Labadi" 3.8 km. Planning to one of those points
     makes the planner fail, and a failed plan is what shows a straight line
     with no cars and no change of car.

     The route network knows its own stops by name, so the NAME is resolved to
     a real stop first and the geocoder coordinate is only a fallback. This is
     why tapping any "Ablekuma" result now lands on the Ablekuma stop.

     Planning to a stop is also what makes the trip honest: the car ends at a
     stop, not at the searched place, so the last leg says which stop you get
     off at instead of inventing a walk from that stop to the destination. */
  const typed=searchEl.value.trim();
  const byName=(window.TrotroNetwork.matchStop((item&&item.name)||'')
             ||window.TrotroNetwork.matchStop(typed));
  // Snap destination to a real stop. The geocoder coordinate for an area
  // like "Ablekuma" or "Adenta" can be kilometres from the actual stop.
  let destPoint=dest;
  if(byName&&byName.score>=40){
    // Named stop: use its exact coordinates
    destPoint=[byName.stop.lon,byName.stop.lat];
  }else{
    // No stop of that name: snap to nearest stop within egress walk distance
    const snapM=TrotroNetwork.meta.egressWalkM||3000;
    const namedStop=TrotroNetwork.nearestStop(dest);
    if(namedStop&&namedStop.meters<=snapM){
      destPoint=[namedStop.stop.lon,namedStop.stop.lat];
    }
  }

  /* One decision, one record. Every screen below, and the map, are drawn from
     `planStart`, so what the app says it started from and what it drew cannot
     disagree. The old code decided this inline and kept the answer only in a
     local, which is exactly how a trip planned from the Circle hub could be
     shown without anyone noticing. */
  activeStart=resolveStart();
  activeStart.at=Date.now();
  planStart=activeStart;
  renderStartRow();
  const startPoint=activeStart.point;

  if(!startPoint){
    routeTitle.textContent='Location unavailable';
    etaMain.textContent='--';
    routeMeta.textContent='Could not determine your starting point. Allow location access or type a start location.';
    return;
  }

  // Show nearest stops to user in the info panel
  const stopsFromUser = TrotroNetwork.stopsNear(startPoint, TrotroNetwork.meta.accessWalkM);
  if(stopsFromUser.length){
    const stopNames = stopsFromUser.slice(0,3).map(s=>s.stop.displayName+' ('+Math.round(s.meters)+' m)').join(', ');
    routeMeta.textContent='Nearest stops to you: '+stopNames+'. Finding your route...';
  }

  /* You are already where you asked to go. */
  if(startPoint&&TrotroNetwork.haversineM(startPoint,destPoint)<150){
    const at=byName&&byName.score>=40?byName.stop:null;
    routeTitle.textContent='You are already here';
    etaMain.textContent='0 min';
    routeMeta.textContent=(at?'You are at '+at.displayName+'. ':'')
      +'That is the place you searched for, so there is nothing to plan.';
    etaArrival.textContent='';
    journeyEl.innerHTML='<div class="notice">You are already at '
      +(at?at.displayName:'the place you searched for')
      +'. If that is wrong, the position this app is using is wrong: tap <b>Start</b> and pick the stop you are really at.</div>';
    fareEl.style.display='none';
    map.flyTo({center:destPoint,zoom:15,duration:900});
    
    return;
  }

  const plan=TrotroNetwork.plan(startPoint,destPoint);

  if(!plan.ok){
    routeTitle.textContent='No trotro journey found';
    etaMain.textContent='--';
    routeMeta.textContent=plan.reason;
    etaArrival.textContent='';
    journeyEl.innerHTML='';

    /* A refusal is only useful if it says what to do next. Two very different
       things can be refused:
         - your position is nowhere near a stop (no car can start from you), or
         - the place you searched is nowhere near a stop (no car ends there),
           which is what happens for anywhere outside the 42 stops of Greater
           Accra: Dodowa, Aburi, Kumasi, Takoradi, and the geocoder's stray
           "Teshie" hits that turn out to be in Tema.
       The old notice always listed the stops near YOU, even when the searched
       place was the problem, so the answer was always "no" and never a way
       forward. Now the relevant end is named, the closest stop is given with
       its distance, and it can be tapped to plan to it. */
    const destProblem=/destination/i.test(plan.reason||'');
    const title=document.createElement('div');
    title.className='notice';
    const strong=document.createElement('b');
    strong.textContent='This is not a trotro route. ';
    title.appendChild(strong);
    title.appendChild(document.createTextNode(
      !activeStart.sure
        ? 'The position this app planned from is not one it can be sure of, so check the Start row before trusting any time here.'
        : destProblem
          ? 'There is no trotro stop near where you searched. Troto only runs between the stops on this network, which covers Greater Accra, so a place outside it cannot be planned to. Search a stop name such as Circle or Kaneshie to plan a real trip.'
          : 'Your position is more than '+prettyDistance(TrotroNetwork.meta.accessWalkM/1000)+' from any stop on this network, so no car can start from where you are.'
    ));
    title.appendChild(document.createTextNode(
      ' The fare below is an estimate for covering the distance directly, not a trotro fare.'
    ));
    journeyEl.appendChild(title);

    const offers=((destProblem?plan.stopsNearDestination:plan.stopsNearOrigin)||[]).slice(0,3);
    if(offers.length){
      const label=document.createElement('div');
      label.className='notice';
      label.textContent=destProblem
        ? 'The closest trotro stop to where you searched is '+(offers.length>1?'one of these: ':'')
        : 'The closest stops to you are:';
      journeyEl.appendChild(label);
      offers.forEach(s=>{
        const row=document.createElement('div');
        row.className='notice stop-offer';
        const name=document.createElement('b');
        name.textContent=s.stop.displayName+' ('+prettyDistance(s.meters/1000)+')';
        row.appendChild(name);
        row.appendChild(document.createTextNode(destProblem
          ? '  tap to plan the trip to this stop'
          : '  tap to plan from here'));
        row.addEventListener('click',()=>selectPlace({
          name:s.stop.displayName, lon:s.stop.lon, lat:s.stop.lat,
          address:s.stop.stationNote||'Trotro stop', type:'transportation'
        }));
        journeyEl.appendChild(row);
      });
    }else if(destProblem){
      // Nothing within reach: say how far the network actually stops, so the
      // reason for the refusal is a fact rather than a shrug.
      const nearest=window.TrotroNetwork?window.TrotroNetwork.nearestStop(destPoint):null;
      if(nearest){
        const line=document.createElement('div');
        line.className='notice';
        line.textContent='The nearest trotro stop on this network is '+nearest.stop.displayName
          +', '+prettyDistance(nearest.meters/1000)+' away.';
        journeyEl.appendChild(line);
      }
    }
    map.flyTo({center:dest,zoom:14,duration:900});
    // A fare does not depend on the route network, so still price it.
    showStraightLineFare(item,destPoint,requestId);
    // The start is shown on a refusal too, because a wrong position is one of
    // the two reasons a trip cannot be planned.
    
    return;
  }

  // Replace the network's straight-line estimates with real driving times.
  const options=[];
  for(const itin of plan.itineraries){
    // First give every car a colour that cannot be mistaken for the colour of
    // the car before it, then hydrate: the map, the chips, the steps and the
    // legend all read the colour off the leg.
    assignCarColors(itin);
    const segments=await hydrateItinerary(itin);
    if(requestId!==activeRouteRequest)return;
    options.push({itin:itin,segments:segments,fareEntries:priceItinerary(itin)});
  }
  options.sort((a,b)=>a.itin.cost-b.itin.cost);

  // An option has to trade something off to earn its place. The planner ranks
  // on its own straight-line estimate, so it can rank a detour well: a trip to
  // Ablekuma was offered "Circle -> Dansoman" purely because those two stops
  // sit 400 m apart, so the car ran kilometres past the destination and the
  // passenger walked back. Real driving times and real fares are known by now,
  // so drop any option that is no quicker, no cheaper and no simpler than one
  // already in the list. A cheaper but slower option is a genuine choice and is
  // always kept.
  const ranked=options.map(o=>({
    option:o,
    minutes:o.itin.totalMinutes||0,
    fare:itineraryFareTotal(o.fareEntries),
    steps:(o.itin.rideCount||0)+(o.itin.transfers||0)
  }));
  const shown=ranked.filter(a=>!ranked.some(b=>b!==a
    && b.minutes<=a.minutes+0.5
    && b.fare<=a.fare+0.01
    && b.steps<=a.steps
    && (b.minutes<a.minutes-0.5||b.fare<a.fare-0.01||b.steps<a.steps)
  )).map(r=>r.option);
  // Never leave the page with nothing to show, whatever the numbers do.
  if(!shown.length)shown.push(options[0]);

  // Show the quickest journey first, using the real driving times rather than
  // the planner's straight-line estimate. The headline and the first card then
  // always agree: before this, a Circle -> Dansoman trip put the fastest option
  // third and read the time off a slower one. Fare, how close the last stop
  // leaves you, and how few cars are involved break a tie; they never outrank
  // actually being quicker.
  shown.sort((a,b)=>
    (a.itin.totalMinutes-b.itin.totalMinutes)
    ||(itineraryFareTotal(a.fareEntries)-itineraryFareTotal(b.fareEntries))
    ||(endGap(a.itin)-endGap(b.itin))
    ||((a.itin.rideCount||0)+(a.itin.transfers||0)-(b.itin.rideCount||0)-(b.itin.transfers||0)));

  const best=shown[0];
  const bi=best.itin;
  const totalMinutes=Math.max(1,Math.round(bi.totalMinutes));
  const arrival=new Date(Date.now()+totalMinutes*60000);

  routeTitle.textContent=tripTitle(bi);
  let currentVal = 0;
  const targetVal = totalMinutes;
  const duration = 1200; // ms
  const startT = performance.now();
  
  etaMain.classList.add('pop');
  const loaderTrack = document.getElementById('etaLoaderTrack');
  const loaderBar = document.getElementById('etaLoaderBar');
  if(loaderTrack) {
    loaderTrack.classList.add('show');
    loaderBar.style.width = '0%';
  }
  
  function animateETA(now) {
    const elapsed = now - startT;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 4);
    const val = Math.floor(easeOut * targetVal);
    
    etaMain.textContent = val + ' min';
    if(loaderBar) loaderBar.style.width = (easeOut * 100) + '%';
    
    if (progress < 1) {
      requestAnimationFrame(animateETA);
    } else {
      etaMain.classList.remove('pop');
      if(loaderTrack) {
        setTimeout(() => loaderTrack.classList.remove('show'), 400);
      }
    }
  }
  requestAnimationFrame(animateETA);
  routeMeta.textContent=prettyDistance((bi.totalMeters||0)/1000)+' travelled * walking, waiting and riding';
  etaArrival.textContent='Estimated arrival * '+arrival.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  renderCarChips(bi);
  renderChangeBanner(bi);
  renderCarLegend(bi);
  // Name the start of the trip on every result, not only when something failed.
  

  renderFareBox(best.fareEntries);

  journeyEl.innerHTML='';
  const head=document.createElement('div');
  head.className='journey-head';
  // One main way, not a list to pick from. The planner still works out the
  // alternatives and drops the ones that lose to this one, so the choice being
  // shown is the best of everything considered - but the passenger gets the
  // answer, not a decision to make.
  const h1=document.createElement('span');h1.textContent='Your journey';
  const h2=document.createElement('span');
  h2.textContent=shown.length>1?'the best of '+shown.length+' ways found':'1 way found';
  head.append(h1,h2);
  journeyEl.appendChild(head);

  const mainCard=renderOption(best.itin,best.fareEntries,0,false);
  mainCard.classList.add('only');
  journeyEl.appendChild(mainCard);

  // Say so when the road times could not be confirmed, so an approximate line
  // is never presented as a measured one. Only the data-quality warning is
  // left: the three notes that followed it (where the stop list comes from,
  // which stop a searched name resolved to, and which start point was used)
  // explained how the tool works rather than the journey, and they sat under
  // every single result.
  if(bi.anyEstimated){
    const n=document.createElement('div');
    n.className='notice';
    n.textContent='Road times are approximate: the live driving service did not answer for part of this trip, so those sections use the network estimate and are drawn as a straight line.';
    journeyEl.appendChild(n);
  }

  drawItinerary(best.segments,startPoint,destPoint,bi);
}

map.on('load',()=>startLocation());
})();
</script>
</body>
</html>
